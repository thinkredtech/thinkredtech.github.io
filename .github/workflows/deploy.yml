name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          # Clean install to prevent rollup optional dependency issues
          rm -rf node_modules package-lock.json
          npm install

      - name: Type check
        working-directory: ./frontend
        run: npm run type-check

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        env:
          VITE_GOOGLE_APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.GOOGLE_APPS_SCRIPT_DEPLOYMENT_ID }}
          VITE_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          VITE_API_TIMEOUT: 30000
          VITE_ENABLE_API_DEBUG: false
          VITE_ENABLE_JOB_APPLICATIONS: true
          VITE_ENABLE_CONTACT_FORM: true
          VITE_ENABLE_BLOG: true
          VITE_ENABLE_PORTFOLIO: true
          VITE_ENABLE_HONEYPOT: true
          VITE_ENABLE_RATE_LIMITING: true
          VITE_RATE_LIMIT_COOLDOWN: 5000
          VITE_ALLOWED_ORIGINS: https://thinkredtech.github.io,http://localhost:3000
          VITE_ENABLE_DEV_LOGGING: false
          VITE_DEV_SERVER_PORT: 3000
          VITE_ENABLE_PROD_SOURCE_MAPS: false
          VITE_ENABLE_BUNDLE_ANALYSIS: false
          VITE_ENABLE_CSS_MINIFICATION: true
          VITE_ENABLE_JS_MINIFICATION: true
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
