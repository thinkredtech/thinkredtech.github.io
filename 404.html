<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Security Headers -->
    <title>ThinkRED Technologies</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect script - INSTANT redirect, no visible page
      (function (l) {
        if (l.search[1] !== "/") {
          var pathSegmentsToKeep = 0;

          l.replace(
            l.protocol +
              "//" +
              l.hostname +
              (l.port ? ":" + l.port : "") +
              l.pathname
                .split("/")
                .slice(0, 1 + pathSegmentsToKeep)
                .join("/") +
              "/?/" +
              l.pathname
                .slice(1)
                .split("/")
                .slice(pathSegmentsToKeep)
                .join("/")
                .replace(/&/g, "~and~") +
              (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
              l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <!-- No visible content - instant redirect -->
  </body>
</html>
