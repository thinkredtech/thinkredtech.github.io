# GitLeaks Configuration for ThinkRED Website
# This configuration excludes false positives while maintaining security

[allowlist]
description = "Allow known safe patterns and documentation examples"

# Allow documentation examples and placeholders
regexes = [
    # README.md examples and placeholders
    'REPLACE_WITH_STRONG_PASSWORD',
    'ACTUAL_VALUE_FROM_ENV_VAR',
    '<YOUR_ADMIN_PASSWORD_HERE>',
    '<YOUR_SECURE_PASSWORD>',
    '<YOUR_SECURE_PASSWORD_HERE>',
    '<ACTUAL_VALUE_FROM_BUILD_PROCESS>',
    'your_api_key_here',
    'your_secure_admin_password_here',
    
    # Documentation patterns
    'const.*=.*process\.env\.',
    'export.*=.*"<YOUR_',
    'echo.*=.*<YOUR_',
    
    # Example environment variable patterns in documentation
    'REACT_APP_.*="<YOUR_',
    'REACT_APP_.*=<YOUR_',
    
    # Build output examples in docs
    '"<ACTUAL_VALUE_FROM_BUILD_PROCESS>"',
    
    # Test and example values
    'ThinkRED2025!',  # This was a previous example that got fixed
    'example_value',
    'placeholder_value',
    'dummy_value'
]

# Allow specific files that contain documentation
paths = [
    # Documentation files
    'README.md',
    'docs/**/*.md',
    'reports/**/*.md',
    
    # Example files
    '.env.example',
    '*.example.*',
    
    # GitHub workflows (they contain patterns but not actual secrets)
    '.github/workflows/**/*.yml'
]

# Allow comments and documentation blocks
commits = []

# Custom rules to enhance detection while reducing false positives
[[rules]]
id = "react-env-var-docs"
description = "Ignore React environment variable documentation examples"
regex = '''REACT_APP_.*=.*(<YOUR_|REPLACE_WITH_)'''
path = '''(README\.md|docs/.*\.md|\.env\.example)'''

[[rules]]
id = "build-output-examples"
description = "Ignore build output examples in documentation"
regex = '''("<ACTUAL_VALUE_FROM_BUILD_PROCESS>"|"ACTUAL_VALUE_FROM_ENV_VAR")'''
path = '''(README\.md|docs/.*\.md)'''

[[rules]]
id = "password-placeholders"
description = "Ignore password placeholder examples"
regex = '''(<YOUR_.*>|REPLACE_WITH_.*|your_.*_password_here)'''
path = '''(README\.md|docs/.*\.md|\.env\.example)'''

[extend]
# Use default rules but with our allowlist
useDefault = true
