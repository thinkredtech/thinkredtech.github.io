<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        
        <!-- Security Headers -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-G5TvyTuo3I5v0tY9LYf2WMhdsedxTYQ70Np/hyIMYgs='; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" />
        <meta http-equiv="X-Content-Type-Options" content="nosniff" />
        <meta http-equiv="X-Frame-Options" content="DENY" />
        <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
        
        <title>ThinkRED Technologies</title>
        <link rel="stylesheet" href="404.css" />
        <script type="text/javascript">
            // GitHub Pages SPA redirect script
            // This script takes the current URL and redirects to the root with the path as a query parameter
            // which can be handled by the React app for client-side routing

            var pathSegmentsToKeep = 0;
            var l = window.location;

            // For user/org sites (like thinkredtech.github.io), we keep 0 path segments
            // For project sites (like username.github.io/project), we would keep 1 segment

            l.replace(
                l.protocol +
                    '//' +
                    l.hostname +
                    (l.port ? ':' + l.port : '') +
                    l.pathname
                        .split('/')
                        .slice(0, 1 + pathSegmentsToKeep)
                        .join('/') +
                    '/?/' +
                    l.pathname
                        .slice(1)
                        .split('/')
                        .slice(pathSegmentsToKeep)
                        .join('/')
                        .replace(/&/g, '~and~') +
                    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                    l.hash
            );
        </script>
    </head>
    <body>
        <div class="redirect-container">
            <h1>Redirecting...</h1>
            <p>
                If you are not redirected automatically, <a href="/">click here</a>.
            </p>
        </div>
    </body>
</html>
