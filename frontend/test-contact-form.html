<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Contact Form Submission</title>
</head>
<body>
    <h1>Test Contact Form Submission</h1>
    <button id="testBtn">Test Contact Form</button>
    <div id="result"></div>

    <script>
        const API_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxiPo1PZW85C8Pfj7bEKT6yk3es9uRZUo4JAXyGWnvJgYLTmuKQPv7WTYvFCx1O2aAlUg/exec';

        const submitContactFormFallback = async (formData) => {
            try {
                const params = new URLSearchParams({
                    action: 'submitContactForm',
                    data: JSON.stringify(formData),
                });

                const response = await fetch(`${API_ENDPOINT}?${params.toString()}`, {
                    method: 'GET',
                    mode: 'cors',
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();

                if (result.error) {
                    throw new Error(result.error);
                }

                return result;
            } catch (error) {
                console.error('Error submitting contact form (fallback):', error);
                throw error;
            }
        };

        const submitContactForm = async (formData) => {
            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    mode: 'cors',
                    body: JSON.stringify({
                        action: 'submitContactForm',
                        data: formData,
                    }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();

                if (result.error) {
                    throw new Error(result.error);
                }

                return result;
            } catch (error) {
                // Check if it's a CORS preflight error
                if (
                    error instanceof TypeError ||
                    (error instanceof Error &&
                        (error.message.includes('Failed to fetch') ||
                        error.message.includes('CORS') ||
                        error.message.includes('405')))
                ) {
                    console.log('POST failed, trying fallback GET method...');
                    return await submitContactFormFallback(formData);
                }
                
                throw error;
            }
        };

        document.getElementById('testBtn').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';

            const testData = {
                formType: 'general',
                name: 'Test User',
                email: 'test@example.com',
                phone: '1234567890',
                company: 'Test Company',
                message: 'This is a test message from the fallback mechanism test.',
                projectType: 'web-development',
                budget: '10000-25000',
                timeline: '1-3-months'
            };

            try {
                const result = await submitContactForm(testData);
                resultDiv.innerHTML = `<div style="color: green;">Success: ${JSON.stringify(result)}</div>`;
            } catch (error) {
                resultDiv.innerHTML = `<div style="color: red;">Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
